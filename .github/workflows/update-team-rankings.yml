name: Update Lone Star Ratings

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 6"
      timezone: "America/Chicago"
    - cron: "0 8 * * 1"
      timezone: "America/Chicago"

permissions:
  contents: write

jobs:
  rankings:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Calculate Lone Star Ratings
        run: python update_team_rankings.py

      - name: Commit rankings
        run: |
          git config user.name "Lone Star Game Finder Bot"
          git config user.email "actions@users.noreply.github.com"
          git add team-rankings.json
          if git diff --cached --quiet; then
            echo "No ranking changes."
          else
            git commit -m "Update Lone Star team ratings"
            git push
          fi
