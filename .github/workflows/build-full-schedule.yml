name: Build Full Texas Schedule

on:
  workflow_dispatch:
  push:
    paths:
      - 'update_schedule.py'
      - '.github/workflows/build-full-schedule.yml'
  schedule:
    # Twice daily during the playoffs: 7:20 AM and 4:20 PM Central.
    # This catches brackets and neutral-site announcements after weekend games.
    - cron: '20 7,16 * 11,12 *'
      timezone: 'America/Chicago'

permissions:
  contents: write

concurrency:
  group: playoff-schedule-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Build statewide schedule index
        run: python -u update_schedule.py

      - name: Commit new season.json
        run: |
          git config user.name "Texas HS Game Finder Bot"
          git config user.email "actions@users.noreply.github.com"
          git add season.json
          if git diff --cached --quiet; then
            echo "No schedule changes."
          else
            git commit -m "Build full Texas weekly schedule index"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
