name: Build Full Texas Schedule

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * 2"
      timezone: "America/Chicago"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Build statewide schedule index
        run: python update_schedule.py

      - name: Commit new season.json
        run: |
          git config user.name "Texas HS Game Finder Bot"
          git config user.email "actions@users.noreply.github.com"
          git add season.json
          if git diff --cached --quiet; then
            echo "No schedule changes."
          else
            git commit -m "Build full Texas weekly schedule index"
            git push
          fi
