name: Refresh Texas Football Schedule

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 2"
      timezone: "America/Chicago"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper packages
        run: pip install -r requirements.txt

      - name: Build statewide schedule index
        run: python update_schedule.py

      - name: Commit updated schedule
        run: |
          git config user.name "Texas HS Game Finder Bot"
          git config user.email "actions@users.noreply.github.com"
          git add season.json
          if git diff --cached --quiet; then
            echo "No schedule changes."
          else
            git commit -m "Refresh statewide football schedule"
            git push
          fi
